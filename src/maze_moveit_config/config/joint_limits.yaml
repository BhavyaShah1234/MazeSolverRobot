# Root key: per-joint limit overrides on top of the URDF's own <limit> tags.
joint_limits:
  # Joint 1's limits.
  fr3_joint1:
    # This joint has an explicit acceleration limit set below.
    has_acceleration_limits: true
    # Maximum acceleration, rad/s^2.
    max_acceleration: 3.75
