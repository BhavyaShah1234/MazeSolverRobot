# Kinematics solver configuration for the fr3_arm planning group.
fr3_arm:
  # Use MoveIt's bundled KDL-based numerical IK solver.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # IK search resolution, in radians.
  kinematics_solver_search_resolution: 0.005
  # Maximum time, in seconds, KDL may spend searching for an IK solution.
  kinematics_solver_timeout: 0.005
