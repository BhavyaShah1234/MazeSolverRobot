# franka_hardware/FrankaHardwareInterface is fundamentally torque-controlled:
# it only exposes an effort command interface, so joint_trajectory_controller
# needs PID gains to turn position/velocity waypoints into effort commands.
# Interfaces and gains match franka_ros2's own reference
# (franka_fr3_moveit_config/config/fr3_ros_controllers.yaml) exactly -- this
# is real hardware behavior, not something maze_solver gets to choose.
joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      fr3_joint1: { p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0 }
      fr3_joint2: { p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0 }
      fr3_joint3: { p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0 }
      fr3_joint4: { p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0 }
      fr3_joint5: { p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0 }
      fr3_joint6: { p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0 }
      fr3_joint7: { p: 50.0, d: 5.0, i: 0.0, i_clamp: 1.0 }
